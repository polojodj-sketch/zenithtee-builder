name: Build ZenithTee APK

on:
  push:
    branches-ignore:
      - gh-readonly-queue/**
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-24.04
    env:
      CARGO_HTTP_MULTIPLEXING: false
    steps:
    - uses: actions/checkout@v5

    - name: Prepare Linux
      run: |
        sudo apt-get update -y
        sudo apt-get install -y ninja-build openjdk-21-jdk openssl git
        curl -LO https://github.com/Kitware/CMake/releases/download/v3.22.1/cmake-3.22.1-Linux-x86_64.tar.gz
        mkdir -p /home/runner/cmake
        tar --strip-components 1 -C /home/runner/cmake -xf cmake-3.22.1-Linux-x86_64.tar.gz
        rustup default 1.92.0
        cargo install cargo-ndk
        rustup target add armv7-linux-androideabi
        rustup target add i686-linux-android
        rustup target add aarch64-linux-android
        rustup target add x86_64-linux-android

    - name: Install Vulkan SDK
      uses: humbletim/install-vulkan-sdk@v1.2
      with:
        version: 1.3.296.0
        cache: true

    - name: Clone DDNet with submodules
      run: |
        git clone --recursive https://github.com/ddnet/ddnet.git
        cd ddnet

    - name: Apply ZenithTee modifications
      run: |
        cd ddnet
        cp -v ../ddnet-src/engine/shared/config_variables.h engine/shared/config_variables.h
        cp -v ../ddnet-src/src/game/client/components/kinetix/kinetix.h src/game/client/components/kinetix/kinetix.h
        cp -v ../ddnet-src/src/game/client/components/kinetix/kinetix.cpp src/game/client/components/kinetix/kinetix.cpp
        cp -v ../ddnet-src/src/game/client/components/kinetix/kinetix_internal.h src/game/client/components/kinetix/kinetix_internal.h
        cp -v ../ddnet-src/src/game/client/components/kinetix/clickgui.cpp src/game/client/components/kinetix/clickgui.cpp
        cp -v ../ddnet-src/src/game/client/components/kinetix/clickgui.h src/game/client/components/kinetix/clickgui.h
        cp -v ../ddnet-src/src/game/client/components/kinetix/zenith_hud.h src/game/client/components/kinetix/zenith_hud.h
        cp -v ../ddnet-src/src/game/client/components/kinetix/zenith_hud.cpp src/game/client/components/kinetix/zenith_hud.cpp
        cp -v ../ddnet-src/src/game/client/components/kinetix/zenith_ride.cpp src/game/client/components/kinetix/zenith_ride.cpp
        cp -v ../ddnet-src/src/game/client/components/kinetix/dummies/process_dummy.cpp src/game/client/components/kinetix/dummies/process_dummy.cpp
        cp -v ../ddnet-src/src/game/client/gameclient.cpp src/game/client/gameclient.cpp
        cp -v ../ddnet-src/CMakeLists.txt CMakeLists.txt
        git diff --stat

    - name: Build Android app (arm64)
      env:
        TW_KEY_NAME: /home/runner/ZenithTee.jks
        TW_KEY_ALIAS: ZenithTee-Key
      run: |
        export TW_KEY_PW="$(openssl rand -base64 32)"
        keytool -genkey -v -keystore "$TW_KEY_NAME" -keyalg RSA -keysize 2048 -validity 10000 -alias "$TW_KEY_ALIAS" -storepass "$TW_KEY_PW" -dname "CN=ZenithTee CI, OU=ZenithTee, O=ZenithTee"
        export ANDROID_HOME="/home/runner/Android/Sdk"
        unset ANDROID_SDK_ROOT
        export PATH=/home/runner/cmake/bin:$PATH
        cd ddnet
        scripts/android/download_android_sdk.sh /home/runner
        scripts/android/cmake_android.sh arm64 ZenithTee org.zenith.client Release build-android
        mkdir -p artifacts
        mv build-android/*.apk artifacts/ 2>/dev/null || true
        ls -la artifacts/

    - uses: actions/upload-artifact@v4
      with:
        name: ZenithTee-APK
        path: ddnet/artifacts/*.apk
