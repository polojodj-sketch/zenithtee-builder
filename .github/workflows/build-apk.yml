name: Build ZenithTee APK

on:
  push:
    branches-ignore:
      - gh-readonly-queue/**
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_HTTP_MULTIPLEXING: false
    steps:
    - uses: actions/checkout@v5
      with:
        submodules: recursive

    - name: Prepare Linux
      run: |
        sudo apt-get update -y
        sudo apt-get install -y ninja-build openjdk-21-jdk openssl git
        curl -LO https://github.com/Kitware/CMake/releases/download/v3.22.1/cmake-3.22.1-Linux-x86_64.tar.gz
        mkdir -p /home/runner/cmake
        tar --strip-components 1 -C /home/runner/cmake -xf cmake-3.22.1-Linux-x86_64.tar.gz
        rustup default 1.92.0
        cargo install cargo-ndk
        rustup target add armv7-linux-androideabi
        rustup target add i686-linux-android
        rustup target add aarch64-linux-android
        rustup target add x86_64-linux-android

    - name: Clone DDNet
      run: |
        rm -rf ddnet
        git clone --depth 1000 https://github.com/ddnet/ddnet.git ddnet
        cd ddnet
        git fetch --depth 1000 origin master
        git checkout 7cbcf36af5acd6a36c57952000f7e46c19f91ebf
        for sm in $(git submodule status | awk '{print $2}'); do
          git submodule update --init --depth 1000 "$sm"
        done

    - name: Download Lua + sol2
      run: |
        set -e
        cd ddnet
        curl -sSLo /tmp/lua.tar.gz https://www.lua.org/ftp/lua-5.4.6.tar.gz
        tar -xzf /tmp/lua.tar.gz
        mkdir -p src/engine/external/lua
        cp lua-5.4.6/src/*.c lua-5.4.6/src/*.h lua-5.4.6/src/lua.hpp src/engine/external/lua/
        rm -rf lua-5.4.6 lua.tar.gz
        mkdir -p src/engine/external/sol2
        curl -sSL -o src/engine/external/sol2/sol.hpp https://github.com/ThePhD/sol2/releases/download/v3.3.0/sol.hpp
        mkdir -p src/engine/external/sol2/sol
        curl -sSL -o src/engine/external/sol2/sol/config.hpp https://raw.githubusercontent.com/ThePhD/sol2/v3.3.0/include/sol/config.hpp
        python3 - <<'PYEOF'
        import io
        path = "src/engine/external/sol2/sol.hpp"
        data = io.open(path, "r", encoding="utf-8").read()
        normalized = data.replace("\r\n", "\n")
        old = "*this = nullopt;\n\t\t\tthis->construct(std::forward<Args>(args)...);\n\t\t}"
        new = "*this = nullopt;\n\t\t\tm_value = std::addressof(std::forward<Args>(args)...);\n\t\t\treturn *m_value;\n\t\t}"
        count = normalized.count(old)
        normalized = normalized.replace(old, new)
        io.open(path, "w", encoding="utf-8", newline="").write(normalized)
        print("patched optional<T&>::emplace occurrences:", count)
        if count != 1:
            raise SystemExit("sol.hpp emplace fix did not match exactly once")
        PYEOF

    - name: Apply ZenithTee patches
      run: |
        set -e
        cd ddnet
        echo "=== Applying $(ls ../patches/*.patch | wc -l) ZenithTee patches ==="
        for p in ../patches/*.patch; do
          echo "--- $(basename "$p") ---"
          git apply --whitespace=nowarn "$p"
        done
        echo "=== Verify ==="
        grep -c "CBotControl m_BotControl" src/game/client/gameclient.h
        grep -c "m_BotControl" src/game/client/gameclient.cpp
        echo "=== Patched OK ==="

    - name: Build Android app (arm64)
      env:
        TW_KEY_NAME: /home/runner/ZenithTee.jks
        TW_KEY_ALIAS: ZenithTee-Key
      run: |
        export TW_KEY_PW="$(openssl rand -base64 32)"
        keytool -genkey -v -keystore "$TW_KEY_NAME" -keyalg RSA -keysize 2048 -validity 10000 -alias "$TW_KEY_ALIAS" -storepass "$TW_KEY_PW" -dname "CN=ZenithTee CI, OU=ZenithTee, O=ZenithTee"
        export ANDROID_HOME="/home/runner/Android/Sdk"
        unset ANDROID_SDK_ROOT
        export PATH=/home/runner/cmake/bin:$PATH
        cd ddnet
        scripts/android/download_android_sdk.sh /home/runner
        scripts/android/cmake_android.sh arm64 ZenithTee org.zenith.client Release build-android
        mkdir -p artifacts
        mv build-android/*.apk artifacts/ 2>/dev/null || true
        ls -la artifacts/

    - uses: actions/upload-artifact@v4
      with:
        name: ZenithTee-APK
        path: ddnet/artifacts/*.apk
