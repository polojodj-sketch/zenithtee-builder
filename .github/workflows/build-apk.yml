name: Build ZenithTee APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK components
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;29.0.14206865"
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/29.0.14206865
      - run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake python3
          curl https://sh.rustup.rs -sSf | sh -s -- -y --default-toolchain stable --target aarch64-linux-android
          source "$HOME/.cargo/env"
      - name: Clone DDNet with submodules
        run: |
          git clone --recursive https://github.com/ddnet/ddnet.git
          cd ddnet
          # Apply our patches on top of official DDNet
          for p in ../.github/patches/*.patch; do
            echo "=== Applying $p ==="
            git apply "$p" || echo "Skip: $p"
          done
      - name: Configure CMake (arm64)
        working-directory: ddnet
        run: |
          mkdir -p build_arch/arm64
          cd build_arch/arm64
          cmake -H../../ddnet -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_NDK=$ANDROID_NDK_HOME \
            -DANDROID_ABI=arm64-v8a \
            -DCMAKE_ANDROID_NDK=$ANDROID_NDK_HOME \
            -DCMAKE_SYSTEM_NAME=Android \
            -DCMAKE_SYSTEM_VERSION=24 \
            -DCARGO_NDK_TARGET=aarch64-linux-android \
            -DCARGO_NDK_API=24 \
            -DANDROID_PACKAGE_NAME=org.zenith.client \
            -DANDROID_PACKAGE_NAME_JNI=org_zenith_client \
            -DPREFER_BUNDLED_LIBS=ON \
            -DSERVER=ON \
            -DTOOLS=OFF \
            -DVULKAN=OFF \
            -DVIDEORECORDER=OFF
      - name: Build native libraries
        working-directory: ddnet/build_arch/arm64
        run: |
          ninja -j$(nproc) game-client game-server
      - name: Package APK
        working-directory: ddnet
        run: |
          bash scripts/android/cmake_android.sh arm64 ZenithTee org.zenith.client Release build_gh
          ls -la build_gh/*.apk 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: ZenithTee-APK
          path: |
            ddnet/build_gh/ZenithTee-release.apk
            ddnet/build_gh/ZenithTee-debug.apk
